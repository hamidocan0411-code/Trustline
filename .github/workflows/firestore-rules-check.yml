name: Firestore Rules Syntax Check

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - '.github/workflows/firestore-rules-check.yml'
      - 'firebase.json'

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Firestore rules
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-trustline "node -e \"console.log('Firestore rules loaded')\""
