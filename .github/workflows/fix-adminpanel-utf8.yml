name: Fix AdminPanel UTF-8

on:
  push:
    paths:
      - '.github/workflows/fix-adminpanel-utf8.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair AdminPanel UTF-8
        run: |
          npm install --no-save iconv-lite
          node <<'NODE'
          const fs = require('fs');
          const iconv = require('iconv-lite');

          const file = 'src/components/AdminPanel.tsx';
          let text = fs.readFileSync(file, 'utf8').replace(/^\uFEFF/, '');

          const score = (value) => {
            let n = 0;
            for (const ch of value) {
              const cp = ch.codePointAt(0);
              if ([0xC2,0xC3,0xC4,0xC5,0xC6,0xCB,0xE2,0xEF,0xF0,0x11F,0x178,0x161].includes(cp)) n += 2;
              if ((cp >= 0x80 && cp <= 0x9F) || cp === 0xFFFD) n += 5;
            }
            return n;
          };

          let best = text;
          let bestScore = score(best);

          for (let pass = 0; pass < 6; pass++) {
            const candidate = iconv.decode(iconv.encode(best, 'windows-1254'), 'utf8');
            if (candidate.includes('\uFFFD')) break;
            const nextScore = score(candidate);
            if (nextScore < bestScore) {
              best = candidate;
              bestScore = nextScore;
            } else {
              break;
            }
          }

          const direct = {
            'Kurye AtandÄ±': 'Kurye Atandı',
            'Paket AlÄ±ndÄ±': 'Paket Alındı',
            'Ä°ptal Edildi': 'İptal Edildi',
            'MÃ¼sait': 'Müsait',
            'MeÅŸgul': 'Meşgul',
            'Ã‡evrimdÄ±ÅŸÄ±': 'Çevrimdışı',
            'TÃ¼mÃ¼': 'Tümü',
            'Teslimat yapÄ±yor': 'Teslimat yapıyor',
            'Paket alÄ±ndÄ± â€¢ teslimata hazÄ±rlanÄ±yor': 'Paket alındı • teslimata hazırlanıyor',
            'Paket alacak gÃ¶rev Ã¼zerinde': 'Paket alacak görev üzerinde',
            'Paket almaya mÃ¼sait': 'Paket almaya müsait',
            'GÃ–REV ATANDI': 'GÖREV ATANDI',
            'TESLÄ°MATTA': 'TESLİMATTA',
            'Paket almaya uygun deÄŸil': 'Paket almaya uygun değil',
            'Kurye durumu': 'Kurye durumu',
          };

          for (const [from, to] of Object.entries(direct)) {
            best = best.split(from).join(to);
          }

          fs.writeFileSync(file, best, 'utf8');
          console.log('AdminPanel UTF-8 repair complete. Remaining score:', score(best));
          NODE

      - name: Commit repaired file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AdminPanel.tsx
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Repair AdminPanel Turkish text encoding"
            git push
          fi
