name: TrustLine desktop login logo

on: push

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace desktop section
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'src/components/AuthScreen.tsx';
          let text = fs.readFileSync(file, 'utf8');
          const start = '          <section className="hidden min-h-[720px] flex-col justify-center lg:flex">';
          const startIndex = text.indexOf(start);
          if (startIndex < 0) throw new Error('Desktop section start not found');
          const endIndex = text.indexOf('          </section>', startIndex);
          if (endIndex < 0) throw new Error('Desktop section end not found');
          const replacement = `          <section className="hidden min-h-[720px] items-center justify-center lg:flex">
            <div className="relative flex w-full max-w-[720px] items-center justify-center">
              <div aria-hidden="true" className="absolute h-[430px] w-[700px] rounded-full bg-amber-500/10 blur-[110px] motion-safe:animate-[trustlineLogoGlow_6s_ease-in-out_infinite]" />
              <img
                src="https://i.ibb.co/wZpW2m4v/3-E0-E545-B-ADD8-46-F8-A01-F-83-D5-D61-E6-DA5.png"
                alt="TrustLine Express"
                className="relative z-10 h-auto w-full max-w-[700px] object-contain motion-safe:animate-[trustlineLogoReveal_800ms_cubic-bezier(0.22,1,0.36,1)_both]"
                loading="eager"
                decoding="async"
                draggable={false}
              />
            </div>
          </section>`;
          text = text.slice(0, startIndex) + replacement + text.slice(endIndex + '          </section>'.length);
          fs.writeFileSync(file, text, 'utf8');
          NODE

      - name: Add animation CSS
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'src/index.css';
          let text = fs.readFileSync(file, 'utf8');
          if (!text.includes('@keyframes trustlineLogoReveal')) {
            const css = `@keyframes trustlineLogoReveal { from { opacity: 0; transform: translateY(10px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }\n\n@keyframes trustlineLogoGlow { 0%, 100% { opacity: 0.65; transform: scale(0.96); } 50% { opacity: 1; transform: scale(1.03); } }\n\n`;
            text = text.replace('/* Custom sleek scrollbars */', css + '/* Custom sleek scrollbars */');
            fs.writeFileSync(file, text, 'utf8');
          }
          NODE

      - name: Build and verify
        run: |
          npm install --no-audit --no-fund
          npm run build
          grep -q 'hidden min-h-\[720px\] items-center justify-center lg:flex' src/components/AuthScreen.tsx
          grep -q 'i.ibb.co/wZpW2m4v' src/components/AuthScreen.tsx
          grep -q 'lg:hidden' src/components/AuthScreen.tsx
          grep -q 'loginWithGoogle()' src/components/AuthScreen.tsx
          grep -q 'auth/google-redirect-started' src/components/AuthScreen.tsx
          echo 'DESKTOP LOGO: PASS'
          echo 'MOBILE MARKER: PASS'
          echo 'GOOGLE AUTH HANDLER: PASS'
          echo 'GOOGLE REDIRECT HANDLING: PASS'
          echo 'BUILD: PASS'

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AuthScreen.tsx src/index.css
          git diff --cached --quiet || (git commit -m "feat: replace desktop login tracking panel with logo" && git push)
