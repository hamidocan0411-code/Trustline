name: Remove Storage auto init

on:
  push:
    paths:
      - '.github/workflows/remove-storage-autoinit.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove eager Storage initialization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/services/storage.ts')
          text = p.read_text(encoding='utf-8')
          marker = '\nexport const storage =\n  new StorageService();\n\nvoid storage\n  .init()\n  .catch(\n    (error) => {\n      console.error(\n        "❌ Storage başlangıç hatası:",\n        error\n      );\n    }\n  );\n'
          replacement = '\nexport const storage =\n  new StorageService();\n'
          if marker not in text:
              raise SystemExit('Expected Storage auto-init block not found; stopping without changes.')
          p.write_text(text.replace(marker, replacement), encoding='utf-8')
          print('Removed eager storage.init() invocation.')
          PY
      - name: Production build
        run: |
          npm install --ignore-scripts
          npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/storage.ts
          git commit -m "perf: defer Storage initialization until authenticated user"
          git push
