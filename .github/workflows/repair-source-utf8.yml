name: Repair source UTF-8

on:
  push:
    paths:
      - '.github/workflows/repair-source-utf8.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair source text
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const path = require('path');

          const files = execFileSync('git', ['ls-files', 'src', '-z'], { encoding: 'utf8' })
            .split('\0')
            .filter(Boolean)
            .filter((f) => /\.(ts|tsx|js|jsx|mjs|cjs|json|css|scss|html|md|txt)$/.test(f));

          const special = {
            '€':0x80,'‚':0x82,'ƒ':0x83,'„':0x84,'…':0x85,'†':0x86,'‡':0x87,'ˆ':0x88,'‰':0x89,'Š':0x8A,
            '‹':0x8B,'Œ':0x8C,'Ž':0x8E,'‘':0x91,'’':0x92,'“':0x93,'”':0x94,'•':0x95,'–':0x96,'—':0x97,
            '˜':0x98,'™':0x99,'š':0x9A,'›':0x9B,'œ':0x9C,'ž':0x9E,'Ÿ':0x9F
          };

          function cp1252Bytes(text) {
            const out = [];
            for (const ch of text) {
              const cp = ch.codePointAt(0);
              if (cp <= 0x7F || (cp >= 0xA0 && cp <= 0xFF)) out.push(cp);
              else if (special[ch] !== undefined) out.push(special[ch]);
              else return null;
            }
            return Buffer.from(out);
          }

          function repair(text) {
            let best = text.replace(/^\uFEFF/, '');
            for (let i = 0; i < 6; i++) {
              const bytes = cp1252Bytes(best);
              if (!bytes) break;
              const candidate = bytes.toString('utf8');
              if (candidate.includes('\uFFFD') || candidate === best) break;
              if (/[ÃÄÅÂâ]/.test(best) && !/[ÃÄÅÂâ]/.test(candidate)) best = candidate;
              else break;
            }
            return best;
          }

          const direct = [
            ['Ã‡evrimdÄ±ÅŸÄ±', 'Çevrimdışı'],
            ['MÃ¼sait', 'Müsait'],
            ['MeÅŸgul', 'Meşgul'],
            ['Kurye AtandÄ±', 'Kurye Atandı'],
            ['Paket AlÄ±ndÄ±', 'Paket Alındı'],
            ['Ä°ptal Edildi', 'İptal Edildi'],
            ['TÃ¼mÃ¼', 'Tümü'],
            ['Teslimat yapÄ±yor', 'Teslimat yapıyor'],
            ['Paket almaya mÃ¼sait', 'Paket almaya müsait'],
            ['Paket almaya uygun deÄŸil', 'Paket almaya uygun değil'],
            ['GÃ–REV ATANDI', 'GÖREV ATANDI'],
            ['TESLÄ°MATTA', 'TESLİMATTA'],
            ['Ã‡OK ACÄ°L', 'ÇOK ACİL'],
            ['Ã‡ok Acil', 'Çok Acil'],
            ['Ã–rn.', 'Örn.'],
            ['AraÃ§', 'Araç']
          ];

          for (const file of files) {
            const original = fs.readFileSync(file, 'utf8');
            let text = repair(original);
            for (const [from, to] of direct) text = text.split(from).join(to);

            if (file === 'src/services/storage.ts') {
              text = text
                .replaceAll('"Ã‡evrimdÄ±ÅŸÄ±"', '"Çevrimdışı"')
                .replaceAll('"MÃ¼sait"', '"Müsait"')
                .replaceAll('"MeÅŸgul"', '"Meşgul"');
            }

            if (file === 'src/components/AdminPanel.tsx') {
              text = text.replace(/courier\.courierStatus \|\| "[^"\n]*"/g, 'courier.courierStatus || "Çevrimdışı"');
              text = text.replace(/\n(\s*)Kurye durumu\n(\s*)<\/span>/g, '\n$1Kurye durumu:\n$2</span>');
            }

            if (file === 'src/utils/pricing.ts') {
              text = text
                .replaceAll('KÃ¼Ã§Ã¼k', 'Küçük')
                .replaceAll('BÃ¼yÃ¼k', 'Büyük')
                .replaceAll('Ã‡ok BÃ¼yÃ¼k', 'Çok Büyük')
                .replaceAll('kadÄ±kÃ¶y', 'kadıköy')
                .replaceAll('beÅŸiktaÅŸ', 'beşiktaş')
                .replaceAll('avcÄ±lar', 'avcılar')
                .replaceAll('Ã¼skÃ¼dar', 'üsküdar')
                .replaceAll('ÅŸiÅŸli', 'şişli')
                .replaceAll('bakÄ±rkÃ¶y', 'bakırköy')
                .replaceAll('ataÅŸehir', 'ataşehir')
                .replaceAll('sarÄ±yer', 'sarıyer')
                .replaceAll('baÅŸakÅŸehir', 'başakşehir');
            }

            if (text !== original) {
              fs.writeFileSync(file, text, 'utf8');
              console.log('FIXED', file);
            }
          }
          NODE

      - name: Build
        run: npm run build

      - name: Commit source fixes only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No source changes needed"
          else
            git commit -m "Fix Turkish UTF-8 source strings"
            git push
          fi
