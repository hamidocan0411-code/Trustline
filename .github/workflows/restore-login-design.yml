name: Restore latest login design

on:
  push:
    paths:
      - '.github/workflows/restore-login-design.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore login screen from pre-logo version
        shell: bash
        run: |
          git checkout 4bda5a9 -- src/components/AuthScreen.tsx

          python - <<'PY'
          from pathlib import Path
          p = Path('src/index.css')
          text = p.read_text(encoding='utf-8-sig')
          start = text.find('@keyframes trustlineLogoReveal')
          if start != -1:
              marker = '/* Custom sleek scrollbars */'
              end = text.find(marker, start)
              if end != -1:
                  text = text[:start] + text[end:]
              else:
                  raise SystemExit('Logo animation block end marker not found')
              p.write_text(text, encoding='utf-8')

      - name: Verify
        run: |
          grep -q 'TrustLine operasyon ağı' src/components/AuthScreen.tsx
          grep -q 'Teslimatı daha hızlı' src/components/AuthScreen.tsx
          ! grep -q 'trustlineLogoReveal' src/components/AuthScreen.tsx
          ! grep -q 'trustlineLogoReveal' src/index.css
          npm run build

      - name: Commit restored design
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AuthScreen.tsx src/index.css
          git commit -m 'restore: latest login screen design'
          git push
