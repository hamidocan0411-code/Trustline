name: Repair all project UTF-8

on:
  push:
    paths:
      - '.github/workflows/fix-all-utf8.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair all tracked text files
        run: |
          npm install --no-save iconv-lite
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const iconv = require('iconv-lite');
          const exts = new Set(['.ts','.tsx','.js','.jsx','.mjs','.cjs','.json','.css','.scss','.html','.md','.txt','.yml','.yaml','.rules']);
          const tracked = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean).filter(f => exts.has(require('path').extname(f).toLowerCase()) || f.endsWith('.firebaserc'));
          const direct = [
            ['Ã‡evrimdÄ±ÅŸÄ±','Çevrimdışı'],['MÃ¼sait','Müsait'],['MeÅŸgul','Meşgul'],
            ['Kurye AtandÄ±','Kurye Atandı'],['Paket AlÄ±ndÄ±','Paket Alındı'],['Ä°ptal Edildi','İptal Edildi'],
            ['TÃ¼mÃ¼','Tümü'],['Teslimat yapÄ±yor','Teslimat yapıyor'],
            ['Paket almaya mÃ¼sait','Paket almaya müsait'],['Paket almaya uygun deÄŸil','Paket almaya uygun değil'],
            ['GÃ–REV ATANDI','GÖREV ATANDI'],['TESLÄ°MATTA','TESLİMATTA'],['Ã‡OK ACÄ°L','ÇOK ACİL'],['Ã‡ok Acil','Çok Acil'],
            ['Ã–rn.','Örn.'],['AraÃ§','Araç']
          ];
          const special={'€':0x80,'‚':0x82,'ƒ':0x83,'„':0x84,'…':0x85,'†':0x86,'‡':0x87,'ˆ':0x88,'‰':0x89,'Š':0x8A,'‹':0x8B,'Œ':0x8C,'Ž':0x8E,'‘':0x91,'’':0x92,'“':0x93,'”':0x94,'•':0x95,'–':0x96,'—':0x97,'˜':0x98,'™':0x99,'š':0x9A,'›':0x9B,'œ':0x9C,'ž':0x9E,'Ÿ':0x9F};
          function bytes1252(s){const out=[];for(const ch of s){const cp=ch.codePointAt(0);if(cp<=127||(cp>=160&&cp<=255))out.push(cp);else if(special[ch]!==undefined)out.push(special[ch]);else return null;}return Buffer.from(out);}
          function repair(s){let best=s.replace(/^\uFEFF/,'');for(let i=0;i<6;i++){const b=bytes1252(best);if(!b)break;const c=b.toString('utf8');if(c.includes('\uFFFD')||c===best)break;if(/[ÃÄÅÂâ]/.test(best)&&!/[ÃÄÅÂâ]/.test(c))best=c;else break;}return best;}
          for(const file of tracked){const original=fs.readFileSync(file,'utf8');let text=repair(original);for(const [a,b] of direct)text=text.split(a).join(b);if(file==='src/components/AdminPanel.tsx'){text=text.replace(/courier\.courierStatus \|\| "[^"\n]*"/g,'courier.courierStatus || "Çevrimdışı"');text=text.replace(/\n(\s*)Kurye durumu\n(\s*)<\/span>/g,'\n$1Kurye durumu:\n$2</span>');}if(file==='src/services/storage.ts'){text=text.split('"Ã‡evrimdÄ±ÅŸÄ±"').join('"Çevrimdışı"').split('"MÃ¼sait"').join('"Müsait"').split('"MeÅŸgul"').join('"Meşgul"');}if(text!==original){fs.writeFileSync(file,text,'utf8');console.log('FIXED:',file);}}
          NODE
      - name: Build
        run: npm run build
      - name: Commit repaired files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || (git commit -m "Repair all Turkish UTF-8 text across project" && git push)
