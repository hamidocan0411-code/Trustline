name: Remove desktop hero tracking card

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-card:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove desktop-only tracking card
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("src/components/AuthScreen.tsx"); s=p.read_text(encoding="utf-8"); marker="          <div className=\"relative hidden min-h-[540px] lg:block\">"; a=s.find(marker); b=s.find("        </section>", a); assert a != -1, "Desktop hero card marker not found"; assert b != -1, "Hero section end not found"; p.write_text(s[:a]+s[b:], encoding="utf-8")'

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AuthScreen.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: remove desktop hero tracking card"
          git push