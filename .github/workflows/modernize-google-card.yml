name: Modernize Google login card

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  modernize:
    if: ${{ github.event.head_commit.message != 'feat: modernize Google authentication card UI' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Modernize Google authentication card
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/AuthScreen.tsx')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(r'<button type="button" onClick=\{handleGoogle\} disabled=\{loading\} className="[^"]*" aria-label="Google ile TrustLine Express\'e güvenli giriş yap">.*?</button>', re.S)

          replacement = '''<button
                type="button"
                onClick={handleGoogle}
                disabled={loading}
                aria-label="Google ile TrustLine Express'e güvenli giriş yap"
                className="group relative flex min-h-16 w-full items-center gap-3 overflow-hidden rounded-2xl border border-white/10 bg-white/[0.035] px-4 py-3.5 text-left text-sm font-black text-white shadow-[0_12px_35px_rgba(0,0,0,0.22)] transition duration-200 hover:-translate-y-0.5 hover:border-white/20 hover:bg-white/[0.055] hover:shadow-[0_16px_40px_rgba(0,0,0,0.28)] active:translate-y-0 active:scale-[0.99] active:bg-white/[0.07] disabled:cursor-not-allowed disabled:opacity-60 disabled:hover:translate-y-0 disabled:active:scale-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-orange-300/60 focus-visible:ring-offset-2 focus-visible:ring-offset-[#0b0b0b]"
              >
                <span className="pointer-events-none absolute inset-0 bg-gradient-to-r from-orange-400/[0.08] via-transparent to-transparent opacity-0 transition-opacity duration-200 group-hover:opacity-100" aria-hidden="true" />
                <span className="relative flex h-11 w-11 shrink-0 items-center justify-center rounded-xl border border-white/10 bg-white/[0.06] shadow-inner shadow-black/10">
                  {loading ? (
                    <span className="h-5 w-5 animate-spin rounded-full border-2 border-white/20 border-t-white" aria-hidden="true" />
                  ) : (
                    <svg viewBox="0 0 24 24" className="h-5 w-5" aria-hidden="true">
                      <path fill="#4285F4" d="M21.35 12.27c0-.71-.06-1.39-.18-2.05H12v3.88h5.24a4.48 4.48 0 0 1-1.95 2.94v2.45h3.16c1.85-1.7 2.9-4.2 2.9-7.22Z"/>
                      <path fill="#34A853" d="M12 21.7c2.64 0 4.86-.87 6.48-2.36l-3.16-2.45c-.88.59-2 1-3.32 1-2.56 0-4.73-1.73-5.5-4.05H3.23v2.53A9.8 9.8 0 0 0 12 21.7Z"/>
                      <path fill="#FBBC05" d="M6.5 13.84A5.9 5.9 0 0 1 6.19 12c0-.64.11-1.27.31-1.84V7.63H3.23A9.8 9.8 0 0 0 2.2 12c0 1.58.38 3.08 1.03 4.37l3.27-2.53Z"/>
                      <path fill="#EA4335" d="M12 6.11c1.44 0 2.72.5 3.73 1.48l2.8-2.8C16.85 3.24 14.64 2.3 12 2.3a9.8 9.8 0 0 0-8.77 5.33l3.27 2.53C7.27 7.84 9.44 6.11 12 6.11Z"/>
                    </svg>
                  )}
                </span>
                <span className="relative min-w-0 flex-1">
                  <span className="block text-[10px] font-black uppercase tracking-[0.16em] text-slate-500">Güvenli giriş</span>
                  <span className="mt-0.5 block truncate text-sm font-black text-white">{loading ? "Google ile devam ediliyor..." : "Google ile devam et"}</span>
                </span>
                <span className="relative flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-white/10 bg-white/[0.035] text-base text-slate-400 transition duration-200 group-hover:translate-x-0.5 group-hover:border-orange-300/20 group-hover:text-orange-200" aria-hidden="true">→</span>
              </button>'''

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Google login button block not found; no changes made.')

          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AuthScreen.tsx .github/workflows/modernize-google-card.yml
          git commit -m "feat: modernize Google authentication card UI"
          git rm .github/workflows/modernize-google-card.yml
          git commit -m "chore: remove temporary Google card workflow"
          git push
