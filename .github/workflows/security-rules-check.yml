name: Security Rules Check

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Firebase rules
        run: npx --yes firebase-tools emulators:exec --only firestore,storage --project demo-trustline "node -e \"console.log('Firebase security rules loaded successfully')\""
