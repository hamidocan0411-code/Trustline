name: TrustLine performance stage 3

on:
  push:
    branches: [main]

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lazy load AuthScreen
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8-sig')
          old = 'import { AuthScreen } from "./components/AuthScreen";'
          new = 'const AuthScreen = lazy(() => import("./components/AuthScreen").then((m) => ({ default: m.AuthScreen })));'
          if old not in s:
              raise SystemExit('AuthScreen import pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Build verification
        run: npm run build
      - name: Commit optimization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "perf: lazy load AuthScreen"
          git push origin main
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git rm -f .github/workflows/perf-stage3.yml || true
          git diff --cached --quiet || git commit -m "chore: remove temporary performance workflow"
          git push origin main || true
