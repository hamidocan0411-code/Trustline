name: TrustLine performance stage 4

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Production build
        run: npm run build
      - name: Record verified build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/perf-stage4.yml .github/workflows/build-verify-once.yml
          git commit -m "ci: remove temporary build verification workflows"
          git push origin main
