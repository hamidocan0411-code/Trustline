name: TrustLine performance stage 2

on:
  push:
    branches: [main]

jobs:
  optimize:
    if: github.event.head_commit.message != 'perf: optimize initial auth and storage network work'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Optimize deferred Firebase work
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          auth = Path('src/services/auth.ts')
          text = auth.read_text(encoding='utf-8-sig')

          marker = 'const GOOGLE_REDIRECT_PENDING_KEY = "trustline_google_redirect_pending";'
          if marker not in text:
              needle = 'googleProvider.addScope(\n  "https://www.googleapis.com/auth/userinfo.profile"\n);\n'
              replacement = needle + '''\nconst GOOGLE_REDIRECT_PENDING_KEY = "trustline_google_redirect_pending";\n\nfunction markGoogleRedirectPending(): void {\n  try {\n    window.sessionStorage.setItem(GOOGLE_REDIRECT_PENDING_KEY, "1");\n  } catch {\n    // Some private/browser modes may block sessionStorage.\n  }\n}\n\nfunction hasGoogleRedirectPending(): boolean {\n  try {\n    return window.sessionStorage.getItem(GOOGLE_REDIRECT_PENDING_KEY) === "1";\n  } catch {\n    return true;\n  }\n}\n\nfunction clearGoogleRedirectPending(): void {\n  try {\n    window.sessionStorage.removeItem(GOOGLE_REDIRECT_PENDING_KEY);\n  } catch {\n    // ignore\n  }\n}\n'''
              if needle not in text:
                  raise SystemExit('auth insertion point not found')
              text = text.replace(needle, replacement, 1)

          mobile_needle = '''    console.log(\n      "📲 Mobil cihaz algılandı. Google redirect başlatılıyor..."\n    );\n\n    await signInWithRedirect('''
          mobile_replacement = '''    console.log(\n      "📲 Mobil cihaz algılandı. Google redirect başlatılıyor..."\n    );\n\n    markGoogleRedirectPending();\n\n    await signInWithRedirect('''
          if mobile_needle not in text:
              raise SystemExit('mobile redirect insertion point not found')
          text = text.replace(mobile_needle, mobile_replacement, 1)

          popup_needle = '''    console.log(\n      "📲 Popup kullanılamadı. Google redirect başlatılıyor..."\n    );\n\n    await signInWithRedirect('''
          popup_replacement = '''    console.log(\n      "📲 Popup kullanılamadı. Google redirect başlatılıyor..."\n    );\n\n    markGoogleRedirectPending();\n\n    await signInWithRedirect('''
          if popup_needle not in text:
              raise SystemExit('popup redirect insertion point not found')
          text = text.replace(popup_needle, popup_replacement, 1)

          redirect_start = '''export function handleGoogleRedirectResult(): Promise<\n  UserProfile | null\n> {\n  if (redirectResultPromise) {\n    return redirectResultPromise;\n  }\n\n  redirectResultPromise ='''
          redirect_replacement = '''export function handleGoogleRedirectResult(): Promise<\n  UserProfile | null\n> {\n  if (!hasGoogleRedirectPending()) {\n    return Promise.resolve(null);\n  }\n\n  if (redirectResultPromise) {\n    return redirectResultPromise;\n  }\n\n  redirectResultPromise ='''
          if redirect_start not in text:
              raise SystemExit('redirect function insertion point not found')
          text = text.replace(redirect_start, redirect_replacement, 1)

          finally_needle = '''      } catch (error) {\n        console.error(\n          "❌ Google redirect sonucu alınamadı:",\n          error\n        );\n\n        redirectResultPromise =\n          null;\n\n        throw error;\n      }\n'''
          finally_replacement = '''      } catch (error) {\n        console.error(\n          "❌ Google redirect sonucu alınamadı:",\n          error\n        );\n\n        redirectResultPromise =\n          null;\n\n        throw error;\n      } finally {\n        clearGoogleRedirectPending();\n      }\n'''
          if finally_needle not in text:
              raise SystemExit('redirect cleanup insertion point not found')
          text = text.replace(finally_needle, finally_replacement, 1)
          auth.write_text(text, encoding='utf-8')

          storage = Path('src/services/storage.ts')
          s = storage.read_text(encoding='utf-8-sig')
          pattern = re.compile(r'export const storage =\n  new StorageService\(\);\n\nvoid storage\n  \.init\(\)\n  \.catch\(\n    \(error\) => \{\n      console\.error\(\n        "❌ Storage başlangıç hatası:",\n        error\n      \);\n    \}\n  \);\n?', re.M)
          replacement = '''export const storage =\n  new StorageService();\n\n// Storage auth/listener başlangıcı kritik render yolundan çıkarıldı.\n// App kendi Auth akışıyla kullanıcıyı belirlediğinde storage.setCurrentUser()\n// gerekli realtime listener'ları zaten başlatır. Bu fallback yalnızca mevcut\n// oturumlarda ikinci bir güvenlik ağı olarak boşta çalışır.\nif (typeof window !== "undefined") {\n  const startDeferredStorageInit = () => {\n    void storage.init().catch((error) => {\n      console.error("❌ Deferred Storage başlangıç hatası:", error);\n    });\n  };\n\n  if ("requestIdleCallback" in window) {\n    window.requestIdleCallback(startDeferredStorageInit, { timeout: 2000 });\n  } else {\n    window.setTimeout(startDeferredStorageInit, 2000);\n  }\n}\n'''
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('storage auto-init block not found')
          storage.write_text(s2, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit optimized files and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/auth.ts src/services/storage.ts .github/workflows/perf-stage2.yml
          git rm .github/workflows/perf-stage2.yml
          git diff --cached --quiet && exit 0
          git commit -m "perf: optimize initial auth and storage network work"
          git push origin main
