<!doctype html>
<html lang="tr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <title>Trustline Express | Profesyonel Kurye Hizmeti</title>
    <meta name="description" content="Mobil öncelikli profesyonel kurye yönetim platformu ve yapay zeka asistanı" />

    <meta property="og:title" content="Trustline Express | Profesyonel Kurye Hizmeti" />
    <meta property="og:description" content="Mobil öncelikli profesyonel kurye yönetim platformu ve yapay zeka asistanı" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0B0B0D" />

    <link rel="icon" type="image/png" href="https://i.ibb.co/wZpW2m4v/3-E0-E545-B-ADD8-46-F8-A01-F-83-D5-D61-E6-DA5.png" />
    <link rel="apple-touch-icon" href="https://i.ibb.co/wZpW2m4v/3-E0-E545-B-ADD8-46-F8-A01-F-83-D5-D61-E6-DA5.png" />

    <script>
      (() => {
        const leafletCssUrl = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";

        const loadLeafletCssIfNeeded = () => {
          if (!document.querySelector(".leaflet-container")) return;
          if (document.querySelector('link[data-trustline-leaflet="true"]')) return;

          const link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = leafletCssUrl;
          link.dataset.trustlineLeaflet = "true";
          document.head.appendChild(link);

          observer.disconnect();
        };

        const observer = new MutationObserver(loadLeafletCssIfNeeded);
        observer.observe(document.documentElement, {
          subtree: true,
          childList: true,
          attributes: true,
          attributeFilter: ["class"],
        });

        loadLeafletCssIfNeeded();
      })();
    </script>
  </head>

  <body class="bg-[#0B0B0D] text-white antialiased selection:bg-[#D6A84F]/30 selection:text-[#D6A84F] overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
